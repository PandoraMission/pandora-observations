[project]
name = "pandora-observations"
version = "0.0.1"
description = "System of record for what Pandora was asked to observe, what it observed, and whether it was scientifically successful"
authors = [
    {name = "Joe Renaud",email = "joe.p.renaud@gmail.com"}
]
readme = "README.md"
# Floor is 3.11 because shortschedule requires it.
requires-python = ">=3.11,<4.0"
# shortschedule is not on PyPI, so it installs from the scheduler repo's main branch.
dependencies = [
    "rich (>=13.9.4,<14.0.0)",
    "numpy (>=2.4.6)",
    "pandas (>=2.2.3,<3.0.0)",
    "appdirs (>=1.4.4,<2.0.0)",
    "pyarrow (>=15.0)",
    "astropy (>=6.0)",
    "shortschedule @ git+https://github.com/PandoraMission/pandora-short-term-scheduler.git@main",
]

[tool.poetry]
packages = [{include = "pandoraobservations", from = "src"}]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
black = "^25.1.0"
isort = "^6.0.0"
flake8 = "^7.3.0"
jupyterlab = "^4.3.5"
flake8 = "^7.1.2"
jupyterlab = "^4.6.3"
mkdocs = "^1.6.1"
mkdocs-jupyter = "^0.25.1"
mkdocs-material = "^9.7.7"
pytkdocs = {version = "^0.16.2", extras = ["numpy-style"]}
mkdocs-include-markdown-plugin = "^7.1.4"
mkdocstrings = {version = "^1.0.6", extras = ["python"]}
jupyter-contrib-nbextensions = "^0.7.0"
notebook = ">=6.0.0,<7.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119

[tool.isort]
import_heading_firstparty = 'First-party/Local'
import_heading_future = 'Future'
import_heading_stdlib = 'Standard library'
import_heading_thirdparty = 'Third-party'
line_length = 119
multi_line_output = 3
no_lines_before = 'LOCALFOLDER'
profile = 'black'
